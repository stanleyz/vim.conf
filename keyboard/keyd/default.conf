meta=layer(alt_vim)
leftalt=layer(super_sys)
rightalt=overload(control, esc)
rightcontrol=layer(meta)
leftcontrol=overload(control, esc)
leftshift=overload(shift, delete)
rightshift=overload(shift, backspace)
a=overload2(shift, a, 150)
s=overload2(alt_vim, s, 150)
d=overload2(alt, d, 150)
f=overload2(control, f, 150)

j=overload2(control, j, 150)
k=overload2(alt, k, 150)
l=overload2(alt_vim, l, 150)
;=overload2(shift, ;, 150)
