[alt_vim:M]
h=left
l=right
j=down
k=up
u=home
p=end
q=M-l
i=pageup
o=pagedown
right=M-right
left=M-left
up=M-up
down=M-down
enter=M-up

[alt-tab:A]

[super_sys:C]
tab=swapm(alt-tab, macro(A-tab))
q=A-f4
1=A-1
2=A-2
3=A-3
4=A-4
5=A-5
f1=A-f1
f2=A-f2
f3=A-f3
f4=A-f4
f6=A-f6
left=M-left
right=M-right
up=M-up
down=M-down
enter=C-enter
`=swapm(alt-tab, macro(A-`))
space=A-f1

[super_sys+shift]
leftbrace=C-pageup
rightbrace=C-pagedown
3=print
enter=M-up

[super_sys+control]
f4=M-l
